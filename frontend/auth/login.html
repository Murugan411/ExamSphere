<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | ExamSphere</title>

    <!-- Login CSS -->
    <link rel="stylesheet"
          href="../assets/css/auth/login.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <!-- =====================================================
             LEFT SIDE
        ====================================================== -->

        <div class="login-left">

            <h1>
                Welcome Back!
            </h1>

            <p>
                Login to access your dashboard, attend
                exams, view results, and track your
                performance.
            </p>

            <div class="login-image">
                <!-- Image Placeholder -->
            </div>

        </div>


        <!-- =====================================================
             RIGHT SIDE
        ====================================================== -->

        <div class="login-right">

            <div class="login-box">

                <h2>
                    Student Login
                </h2>

                <p>
                    Sign in to continue to ExamSphere
                </p>


                <!-- =================================================
                     LOGIN FORM

                     IMPORTANT:
                     This directly sends the form to
                     StudentLoginServlet.
                ================================================== -->

                <form id="loginForm"
                      action="../studentLogin"
                      method="POST">


                    <!-- ================= EMAIL ================= -->

                    <div class="input-box">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                            autocomplete="email">

                    </div>


                    <!-- ================= PASSWORD ================= -->

                    <div class="input-box">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password">

                            <i
                                class="fa-solid fa-eye"
                                id="togglePassword">
                            </i>

                        </div>

                    </div>


                    <!-- ================= LOGIN OPTIONS ================= -->

                    <div class="login-options">

                        <label>

                            <input
                                type="checkbox"
                                id="rememberMe">

                            Remember Me

                        </label>

                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- ================= LOGIN BUTTON ================= -->

                    <button
                        type="submit"
                        id="loginBtn">

                        Login

                    </button>

                </form>


                <!-- ================= REGISTER ================= -->

                <div class="register-link">

                    <span>
                        Don't have an account?
                    </span>

                    <a href="register.html">
                        Register
                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- Login JavaScript -->
    <script src="../assets/js/auth/login.js"></script>

</body>

</html>
