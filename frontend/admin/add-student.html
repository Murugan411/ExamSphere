<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student | ExamSphere</title>

    <link rel="stylesheet"
          href="../assets/css/admin/admin-student-management.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .add-student-container {
            max-width: 850px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
            color: #1e293b;
        }

        .back-btn {
            text-decoration: none;
            background: #e2e8f0;
            color: #1e293b;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }

        .form-group input,
        .form-group select {
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .form-actions {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .cancel-btn,
        .save-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {

            .add-student-container {
                margin: 20px;
                padding: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }

    </style>

</head>

<body>

    <div class="add-student-container">

        <div class="page-header">

            <div>
                <h1>
                    <i class="fa-solid fa-user-plus"></i>
                    Add Student
                </h1>

                <p>
                    Add a new student to the ExamSphere system.
                </p>
            </div>

            <a href="admin-student-management.html"
               class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>
                Back

            </a>

        </div>


        <form id="addStudentForm">

            <div class="form-grid">


                <!-- FULL NAME -->

                <div class="form-group full">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter full name"
                        required>

                </div>


                <!-- REGISTER NUMBER -->

                <div class="form-group">

                    <label for="registerNumber">
                        Register Number
                    </label>

                    <input
                        type="text"
                        id="registerNumber"
                        placeholder="Enter register number"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                        required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="10-digit phone number"
                        maxlength="10"
                        required>

                </div>


                <!-- DEPARTMENT -->

                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <select id="department" required>

                        <option value="">
                            Select Department
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="EEE">
                            EEE
                        </option>

                        <option value="MECH">
                            MECH
                        </option>

                        <option value="CIVIL">
                            CIVIL
                        </option>

                    </select>

                </div>


                <!-- YEAR -->

                <div class="form-group">

                    <label for="yearOfStudy">
                        Year of Study
                    </label>

                    <select id="yearOfStudy" required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="1">
                            I Year
                        </option>

                        <option value="2">
                            II Year
                        </option>

                        <option value="3">
                            III Year
                        </option>

                        <option value="4">
                            IV Year
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        required>

                </div>


            </div>


            <div class="form-actions">

                <a href="admin-student-management.html"
                   class="cancel-btn">

                    Cancel

                </a>

                <button
                    type="submit"
                    class="save-btn">

                    <i class="fa-solid fa-save"></i>
                    Save Student

                </button>

            </div>

        </form>

    </div>


    <script src="../assets/js/admin/add-student.js"></script>

</body>

</html>
