<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Settings | ExamSphere</title>

    <link rel="stylesheet"
          href="../assets/css/admin/admin-settings.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar">

        <div class="logo">
            <h2>ExamSphere</h2>
        </div>

        <ul>

            <li>
                <a href="admin-dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="admin-student-management.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    Students
                </a>
            </li>

            <li>
                <a href="admin-subject-management.html">
                    <i class="fa-solid fa-book"></i>
                    Subjects
                </a>
            </li>

            <li>
                <a href="admin-category-management.html">
                    <i class="fa-solid fa-layer-group"></i>
                    Categories
                </a>
            </li>

            <li>
                <a href="admin-question-management.html">
                    <i class="fa-solid fa-circle-question"></i>
                    Questions
                </a>
            </li>

            <li>
                <a href="admin-exam-management.html">
                    <i class="fa-solid fa-file-pen"></i>
                    Exams
                </a>
            </li>

            <li>
                <a href="admin-results.html">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                    Results
                </a>
            </li>

            <li>
                <a href="admin-reports.html">
                    <i class="fa-solid fa-chart-pie"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="admin-profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li class="active">
                <a href="admin-settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

            <li>
                <a href="admin-logout.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="main-content">

        <header class="topbar">

            <h1>Settings</h1>

            <p>Manage your ExamSphere application preferences.</p>

        </header>


        <section class="settings-container">


            <!-- =================================
                 ACCOUNT SETTINGS
            ================================== -->

            <div class="setting-card">

                <h2>
                    <i class="fa-solid fa-user"></i>
                    Account Settings
                </h2>

                <button
                    type="button"
                    class="setting-btn"
                    id="updateProfileBtn">

                    Update Profile

                </button>

            </div>


            <!-- =================================
                 SECURITY
            ================================== -->

            <div class="setting-card">

                <h2>
                    <i class="fa-solid fa-lock"></i>
                    Security
                </h2>

                <button
                    type="button"
                    class="setting-btn"
                    id="changePasswordBtn">

                    Change Password

                </button>

            </div>


            <!-- =================================
                 NOTIFICATIONS
            ================================== -->

            <div class="setting-card">

                <h2>
                    <i class="fa-solid fa-bell"></i>
                    Notifications
                </h2>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="notificationToggle">

                    <span class="slider"></span>

                </label>

            </div>


            <!-- =================================
                 DARK MODE
            ================================== -->

            <div class="setting-card">

                <h2>
                    <i class="fa-solid fa-moon"></i>
                    Dark Mode
                </h2>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="darkModeToggle">

                    <span class="slider"></span>

                </label>

            </div>


            <!-- =================================
                 LANGUAGE
            ================================== -->

            <div class="setting-card">

                <h2>
                    <i class="fa-solid fa-language"></i>
                    Language
                </h2>

                <select id="languageSelect">

                    <option value="English">
                        English
                    </option>

                    <option value="Tamil">
                        Tamil
                    </option>

                    <option value="Hindi">
                        Hindi
                    </option>

                </select>

            </div>


            <!-- =================================
                 ACTION BUTTONS
            ================================== -->

            <div class="button-group">

                <button
                    type="button"
                    class="save-btn"
                    id="saveSettingsBtn">

                    <i class="fa-solid fa-check"></i>
                    Save Settings

                </button>


                <button
                    type="button"
                    class="reset-btn"
                    id="resetSettingsBtn">

                    <i class="fa-solid fa-rotate-left"></i>
                    Reset

                </button>

            </div>

        </section>

    </main>


    <!-- =========================================
         CHANGE PASSWORD MODAL
    ========================================== -->

    <div
        class="settings-modal"
        id="passwordModal">

        <div class="settings-modal-content">

            <div class="modal-header">

                <h2>
                    <i class="fa-solid fa-lock"></i>
                    Change Password
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    id="closePasswordModal">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>


            <div class="modal-body">

                <label>
                    Current Password
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Enter current password">


                <label>
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password">


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password">

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="cancel-modal-btn"
                    id="cancelPasswordBtn">

                    Cancel

                </button>

                <button
                    type="button"
                    class="save-password-btn"
                    id="savePasswordBtn">

                    Save Password

                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="../assets/js/admin/admin-settings.js"></script>

</body>

</html>
