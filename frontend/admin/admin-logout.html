 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Logout | ExamSphere</title>

    <link rel="stylesheet"
          href="../assets/css/admin/admin-logout.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar">

        <div class="logo">
            <h2>ExamSphere</h2>
        </div>

        <ul>

            <li>
                <a href="admin-dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="admin-student-management.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    Students
                </a>
            </li>

            <li>
                <a href="admin-subject-management.html">
                    <i class="fa-solid fa-book"></i>
                    Subjects
                </a>
            </li>

            <li>
                <a href="admin-category-management.html">
                    <i class="fa-solid fa-layer-group"></i>
                    Categories
                </a>
            </li>

            <li>
                <a href="admin-question-management.html">
                    <i class="fa-solid fa-circle-question"></i>
                    Questions
                </a>
            </li>

            <li>
                <a href="admin-exam-management.html">
                    <i class="fa-solid fa-file-pen"></i>
                    Exams
                </a>
            </li>

            <li>
                <a href="admin-results.html">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                    Results
                </a>
            </li>

            <li>
                <a href="admin-reports.html">
                    <i class="fa-solid fa-chart-pie"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="admin-profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li>
                <a href="admin-settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

            <li class="active">
                <a href="admin-logout.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="main-content">

        <div class="logout-container">

            <div class="logout-card">

                <div class="logout-icon">

                    <i class="fa-solid fa-right-from-bracket"></i>

                </div>


                <h1>Logout</h1>


                <p class="logout-title">
                    Are you sure you want to logout?
                </p>


                <p class="logout-description">
                    You will be signed out of your ExamSphere
                    administrator session.
                </p>


                <div class="logout-buttons">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelLogout">

                        <i class="fa-solid fa-arrow-left"></i>

                        Cancel

                    </button>


                    <button
                        type="button"
                        class="logout-btn"
                        id="confirmLogout">

                        <i class="fa-solid fa-right-from-bracket"></i>

                        Logout

                    </button>

                </div>

            </div>

        </div>

    </main>


    <script src="../assets/js/admin/admin-logout.js"></script>

</body>

</html>
