<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile | ExamSphere</title>

    <link rel="stylesheet"
          href="../assets/css/student/student-profile.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <h2>ExamSphere</h2>

        </div>

        <ul>

            <li>

                <a href="student-dashboard.html">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </a>

            </li>

            <li class="active">

                <a href="student-profile.html">

                    <i class="fa-solid fa-user"></i>

                    Profile

                </a>

            </li>

            <li>

                <a href="student-available-exams.html">

                    <i class="fa-solid fa-file-circle-check"></i>

                    Available Exams

                </a>

            </li>

            <li>

                <a href="student-history.html">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    History

                </a>

            </li>

            <li>

                <a href="student-result.html">

                    <i class="fa-solid fa-square-poll-vertical"></i>

                    Results

                </a>

            </li>

            <li>

                <a href="student-leaderboard.html">

                    <i class="fa-solid fa-ranking-star"></i>

                    Leaderboard

                </a>

            </li>

            <li>

                <a href="student-certificate.html">

                    <i class="fa-solid fa-award"></i>

                    Certificate

                </a>

            </li>

            <li>

                <a href="student-logout.html">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header class="topbar">

            <h1>Student Profile</h1>

            <span>Welcome, Student</span>

        </header>

        <section class="profile-container">

            <div class="profile-card">

                <div class="profile-image">

                    <!-- Student Image -->

                </div>

                <button class="upload-btn">

                    Upload Photo

                </button>

            </div>

            <div class="profile-details">

                <form>

                    <div class="form-group">

                        <label>Full Name</label>

                        <input type="text"
                               value="John Doe">

                    </div>

                    <div class="form-group">

                        <label>Student ID</label>

                        <input type="text"
                               value="STU1001"
                               readonly>

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input type="email"
                               value="student@email.com">

                    </div>

                    <div class="form-group">

                        <label>Phone Number</label>

                        <input type="text"
                               value="9876543210">

                    </div>

                    <div class="form-group">

                        <label>Department</label>

                        <input type="text"
                               value="Computer Science Engineering">

                    </div>

                    <div class="form-group">

                        <label>Year</label>

                        <input type="text"
                               value="Final Year">

                    </div>

                    <div class="form-group">

                        <label>Date of Joining</label>

                        <input type="text"
                               value="10 June 2023"
                               readonly>

                    </div>

                    <div class="button-group">

                        <button type="button">

                            Edit Profile

                        </button>

                        <button type="submit">

                            Save Changes

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <script src="../assets/js/student/student-profile.js"></script>

</body>

</html>
