<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | ExamSphere</title>

    <link rel="stylesheet" href="../assets/css/auth/forgot-password.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="forgot-container">

        <!-- Left Section -->

        <div class="forgot-left">

            <h1>Forgot Your Password?</h1>

            <p>

                Don't worry! Enter your registered email address to reset your password.

            </p>

            <div class="forgot-image">

                <!-- Image will be added later -->

            </div>

        </div>

        <!-- Right Section -->

        <div class="forgot-right">

            <div class="forgot-box">

                <h2>Reset Password</h2>

                <p>Enter your email and create a new password.</p>

                <form>

                    <div class="input-box">

                        <label>Email Address</label>

                        <input
                            type="email"
                            placeholder="Enter your registered email"
                            required>

                    </div>

                    <div class="input-box">

                        <label>New Password</label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="newPassword"
                                placeholder="Enter new password"
                                required>

                            <i class="fa-solid fa-eye" id="toggleNewPassword"></i>

                        </div>

                    </div>

                    <div class="input-box">

                        <label>Confirm Password</label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm password"
                                required>

                            <i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>

                        </div>

                    </div>

                    <button type="submit">

                        Reset Password

                    </button>

                </form>

                <div class="back-link">

                    <a href="login.html">

                        ← Back to Login

                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="../assets/js/auth/forgot-password.js"></script>

</body>

</html>
