<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ExamSphere</title>

    <link rel="stylesheet"
          href="../assets/css/admin/admin-login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <!-- Left Side -->

        <div class="login-left">

            <h1>ExamSphere Admin</h1>

            <p>

                Welcome to the Administration Portal.

                Manage students, exams, question banks,
                reports and system settings from one place.

            </p>

            <div class="login-image">

                <!-- Admin Illustration will be added later -->

            </div>

        </div>

        <!-- Right Side -->

        <div class="login-right">

            <div class="login-box">

                <div class="admin-icon">

                    <i class="fa-solid fa-user-shield"></i>

                </div>

                <h2>Administrator Login</h2>

                <p>

                    Login using your administrator credentials.

                </p>

                <form>

                    <div class="input-box">

                        <label>Admin Email</label>

                        <input
                            type="email"
                            placeholder="Enter admin email"
                            required>

                    </div>

                    <div class="input-box">

                        <label>Password</label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter password"
                                required>

                            <i class="fa-solid fa-eye"
                               id="togglePassword"></i>

                        </div>

                    </div>

                    <div class="login-options">

                        <label>

                            <input type="checkbox">

                            Remember Me

                        </label>

                        <a href="#">

                            Forgot Password?

                        </a>

                    </div>

                    <button type="submit">

                        Login

                    </button>

                </form>

                <div class="back-home">

                    <a href="../index.html">

                        ← Back to Home

                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="../assets/js/admin/admin-login.js"></script>

</body>

</html>
