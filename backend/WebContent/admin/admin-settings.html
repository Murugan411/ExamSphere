<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Settings | ExamSphere</title>

    <link rel="stylesheet"
          href="../assets/css/admin/admin-settings.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <h2>ExamSphere</h2>

        </div>

        <ul>

            <li>
                <a href="admin-dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="admin-student-management.html">
                    <i class="fa-solid fa-user-graduate"></i>
                    Students
                </a>
            </li>

            <li>
                <a href="admin-subject-management.html">
                    <i class="fa-solid fa-book"></i>
                    Subjects
                </a>
            </li>

            <li>
                <a href="admin-category-management.html">
                    <i class="fa-solid fa-layer-group"></i>
                    Categories
                </a>
            </li>

            <li>
                <a href="admin-question-management.html">
                    <i class="fa-solid fa-circle-question"></i>
                    Questions
                </a>
            </li>

            <li>
                <a href="admin-exam-management.html">
                    <i class="fa-solid fa-file-pen"></i>
                    Exams
                </a>
            </li>

            <li>
                <a href="admin-results.html">
                    <i class="fa-solid fa-square-poll-vertical"></i>
                    Results
                </a>
            </li>

            <li>
                <a href="admin-reports.html">
                    <i class="fa-solid fa-chart-pie"></i>
                    Reports
                </a>
            </li>

            <li>
                <a href="admin-profile.html">
                    <i class="fa-solid fa-user"></i>
                    Profile
                </a>
            </li>

            <li class="active">
                <a href="admin-settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

            <li>
                <a href="admin-logout.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header class="topbar">

            <h1>Settings</h1>

            <p>Manage your application preferences.</p>

        </header>

        <section class="settings-container">

            <div class="setting-card">

                <h2>

                    <i class="fa-solid fa-user"></i>

                    Account Settings

                </h2>

                <button class="setting-btn">

                    Update Profile

                </button>

            </div>

            <div class="setting-card">

                <h2>

                    <i class="fa-solid fa-lock"></i>

                    Security

                </h2>

                <button class="setting-btn">

                    Change Password

                </button>

            </div>

            <div class="setting-card">

                <h2>

                    <i class="fa-solid fa-bell"></i>

                    Notifications

                </h2>

                <label class="switch">

                    <input type="checkbox" checked>

                    <span class="slider"></span>

                </label>

            </div>

            <div class="setting-card">

                <h2>

                    <i class="fa-solid fa-moon"></i>

                    Dark Mode

                </h2>

                <label class="switch">

                    <input type="checkbox">

                    <span class="slider"></span>

                </label>

            </div>

            <div class="setting-card">

                <h2>

                    <i class="fa-solid fa-language"></i>

                    Language

                </h2>

                <select>

                    <option>English</option>

                    <option>Tamil</option>

                    <option>Hindi</option>

                </select>

            </div>

            <div class="button-group">

                <button class="save-btn">

                    Save Settings

                </button>

                <button class="reset-btn">

                    Reset

                </button>

            </div>

        </section>

    </main>

    <script src="../assets/js/admin/admin-settings.js"></script>

</body>

</html>
