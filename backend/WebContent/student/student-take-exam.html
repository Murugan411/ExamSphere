<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Take Exam | ExamSphere</title>

    <link rel="stylesheet"
          href="../assets/css/student/student-take-exam.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <main class="exam-container">

        <!-- Header -->

        <header class="exam-header">

            <div>

                <h2>Java Programming Assessment</h2>

                <p>Answer all questions before submitting.</p>

            </div>

            <div class="timer">

                <i class="fa-solid fa-clock"></i>

                <span id="timer">60:00</span>

            </div>

        </header>

        <!-- Body -->

        <div class="exam-body">

            <!-- Question Panel -->

            <section class="question-panel">

                <div class="question-number">

                    Question <span id="questionNo">1</span> of 30

                </div>

                <h3 id="questionText">

                    What is the default value of an int variable in Java?

                </h3>

                <div class="options">

                    <label>

                        <input type="radio"
                               name="answer">

                        0

                    </label>

                    <label>

                        <input type="radio"
                               name="answer">

                        null

                    </label>

                    <label>

                        <input type="radio"
                               name="answer">

                        undefined

                    </label>

                    <label>

                        <input type="radio"
                               name="answer">

                        1

                    </label>

                </div>

                <div class="exam-buttons">

                    <button id="previousBtn">

                        Previous

                    </button>

                    <button id="nextBtn">

                        Save & Next

                    </button>

                </div>

            </section>

            <!-- Question Navigation -->

            <aside class="question-navigation">

                <h3>Questions</h3>

                <div class="question-grid">

                    <button class="active">1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>10</button>
                    <button>11</button>
                    <button>12</button>
                    <button>13</button>
                    <button>14</button>
                    <button>15</button>
                    <button>16</button>
                    <button>17</button>
                    <button>18</button>
                    <button>19</button>
                    <button>20</button>
                    <button>21</button>
                    <button>22</button>
                    <button>23</button>
                    <button>24</button>
                    <button>25</button>
                    <button>26</button>
                    <button>27</button>
                    <button>28</button>
                    <button>29</button>
                    <button>30</button>

                </div>

                <button id="submitExam">

                    Submit Exam

                </button>

            </aside>

        </div>

    </main>

    <script src="../assets/js/student/student-take-exam.js"></script>

</body>

</html>
